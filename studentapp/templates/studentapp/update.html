<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Page</title>
</head>
<body>
    <center>    <h1>Update {{ data.name }} Details</h1>
    <form action="/student/update/{{ data.roll }}/" method="post">
        {% csrf_token %}
        <label for="roll">Roll Number:</label>
        <input type="number" id="roll" name="roll" value="{{ data.roll }}" disabled><br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ data.name }}" required><br><br>
        <label for="marks">Marks:</label>
        <input type="number" id="marks" name="marks" value="{{ data.marks }}" required><br><br>
        <button type="submit">Update</button>

    </form><br><br><hr>
    {%if msg %}
    <h3 style="color:green">{{msg}}</h3><br><br>
    {% endif %}
    <a href="/student/home/">Home Page</a><br><br>
    <a href="/student/display/">Display all Students</a>
    </center>

</body>
</html>
